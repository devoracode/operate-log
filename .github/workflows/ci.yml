name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 的最小门禁：整 reactor 在 JDK 8（编译目标下限）+ 默认 Boot 2.7.18 上全量测试，并做 Javadoc 校验。
  # JDK 8 下 boot3-test profile 不激活，本 job 只跑 boot2 侧用例。
  test:
    name: test (JDK 8, Boot 2.7.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      # javadoc:javadoc 单独跑只走到 generate-sources，同 reactor 的兄弟模块拿不到产物，
      # 所以必须和 test 挂在同一次调用里（Maven 会先跑完 test 阶段再执行该 goal）
      - name: Build, test and check Javadoc
        run: mvn --errors --batch-mode clean test javadoc:javadoc
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk8
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # README「支持的版本」承诺（Boot 2.2+ / 3.0-3.5 全线）由矩阵守着；
  # 两个基线 2.7.18 / 3.3.13 已被 test 与下面的 full-reactor 覆盖，不重复跑
  matrix:
    name: test (JDK ${{ matrix.java-version }}, ${{ matrix.property }}=${{ matrix.boot-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.7.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.6.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.5.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.4.13'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.0.13'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.1.12'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.2.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: >
          mvn --errors --batch-mode clean test
          -D${{ matrix.property }}=${{ matrix.boot-version }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.property }}-${{ matrix.boot-version }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # 整 reactor 在 JDK 17 上构建：boot3-test profile 自动激活，
  # Boot 3 用户的环境（jakarta 栈 + 宿主的 Spring 6 / Jackson 2.17）在此覆盖
  full-reactor:
    name: full reactor (JDK 17, Boot 3.3.13)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn --errors --batch-mode clean test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk17
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
