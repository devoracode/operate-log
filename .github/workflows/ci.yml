name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 保留已有的状态检查名称，让引用该检查的分支保护同时覆盖两个基线。
  test:
    name: test (JDK 8, Boot 2.7.18)
    needs: [jdk8, full-reactor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both baselines to pass
        env:
          JDK8_RESULT: ${{ needs.jdk8.result }}
          JDK17_RESULT: ${{ needs.full-reactor.result }}
        run: |
          if [[ "$JDK8_RESULT" != success || "$JDK17_RESULT" != success ]]; then
            echo "::error::Baseline checks did not pass (JDK 8: $JDK8_RESULT; JDK 17: $JDK17_RESULT)."
            exit 1
          fi

  # JDK 8 下 boot3-test profile 不激活，本 job 只跑 boot2 侧用例。
  jdk8:
    name: JDK 8 baseline (Boot 2.7.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      # javadoc:javadoc 单独跑只走到 generate-sources，同 reactor 的兄弟模块拿不到产物，
      # 所以必须和 test 挂在同一次调用里（Maven 会先跑完 test 阶段再执行该 goal）
      - name: Build, test and check Javadoc
        run: mvn --errors --batch-mode clean test javadoc:javadoc
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk8
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # README「支持的版本」承诺（Boot 2.2-2.7 / 3.0-3.5）由矩阵覆盖各次版本线；
  # 两个基线 2.7.18 / 3.3.13 已由 jdk8 和 full-reactor 覆盖。
  matrix:
    name: test (JDK ${{ matrix.java-version }}, ${{ matrix.property }}=${{ matrix.boot-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.2.13.RELEASE'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.3.12.RELEASE'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.7.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.6.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.5.15'
          - java-version: '8'
            property: spring.boot2.version
            boot-version: '2.4.13'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.0.13'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.1.12'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.2.12'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.4.13'
          - java-version: '17'
            property: spring.boot3.version
            boot-version: '3.5.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: >
          mvn --errors --batch-mode clean test
          -D${{ matrix.property }}=${{ matrix.boot-version }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.property }}-${{ matrix.boot-version }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # 整 reactor 在 JDK 17 上构建，boot3-test profile 自动激活，覆盖 Boot 3 宿主。
  full-reactor:
    name: full reactor (JDK 17, Boot 3.3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Servlet adapter symmetry
        run: node .github/scripts/check-servlet-symmetry.mjs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn --errors --batch-mode clean test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk17
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
