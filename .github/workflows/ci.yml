# operate-log CI
#
# 双栈矩阵是本项目的核心护城河，CI 必须锁死：
#   - JDK 8/17/21 全矩阵跑 `clean verify`（boot3 模块经 JDK[17,) profile 自动激活/跳过）
#   - JDK 8  认证：core/starter/boot2 全量测试
#   - JDK 17 认证：core/starter/boot2/boot3 全量测试（Boot 3 最低运行时）
#   - JDK 21 认证：全量（Boot 2.7 官方支持上限 + Boot 3 主流运行时）
#   - dependency-hygiene：对 Boot 2 / Boot 3 / Starter 三棵真实依赖树做版本污染校验
#     （测试工程 import BOM 会掩盖库侧污染，所以必须单独验依赖树本身）
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # 单栈/单 JDK 失败不掩盖另一栈结果：矩阵全部跑完再汇总
      fail-fast: false
      matrix:
        java: [ 8, 17, 21 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      # reactor 由根 pom 决定：JDK 8 下 boot3-test profile 不激活，
      # 自动只构建 core/starter/boot2；JDK 17+ 四个模块全量。
      # -ntp: 不打印下载进度，日志更干净。
      - name: Build and test (full reactor)
        run: mvn -B -ntp clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            '**/target/surefire-reports/*.txt'
            '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  # 依赖污染门禁：库产物绝不能把宿主框架的版本推给消费者。
  # 「测试能跑」证明不了这一点（测试工程 import BOM，会覆盖传递版本），
  # 因此这里直接对三棵真实依赖树做校验，规则见脚本注释。
  dependency-hygiene:
    name: Dependency hygiene (Boot 2 / Boot 3 trees)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and install reactor (skip tests)
        run: mvn -B -ntp -DskipTests install

      - name: Dump dependency trees
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/dep-tree"
          mvn -B -ntp dependency:tree -pl operate-log-test-boot2 \
              -DoutputFile="$GITHUB_WORKSPACE/target/dep-tree/boot2.txt"
          mvn -B -ntp dependency:tree -pl operate-log-test-boot3 \
              -DoutputFile="$GITHUB_WORKSPACE/target/dep-tree/boot3.txt"
          mvn -B -ntp dependency:tree -pl operate-log-spring-boot-starter \
              -DoutputFile="$GITHUB_WORKSPACE/target/dep-tree/starter.txt"

      - name: Verify no version pollution
        run: bash .github/scripts/dependency-hygiene.sh \
              target/dep-tree/boot2.txt target/dep-tree/boot3.txt target/dep-tree/starter.txt

      - name: Upload dependency trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-trees
          path: target/dep-tree/*.txt
          if-no-files-found: ignore
          retention-days: 7

  # release 构建干跑：验证 sources/javadoc jar 可生成（javadoc 严格模式是发布事故高发区）
  release-dry-run:
    name: Release build dry-run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Package with sources & javadoc (no signing, no upload)
        run: mvn -B -ntp -Prelease-check -DskipTests clean package
