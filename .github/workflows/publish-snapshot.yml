name: Publish SNAPSHOT

# 自动发布只接力本仓库 main 上通过 CI 的 push；手动发布只能选择 main。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 与 release.yml 共用同一组，避免快照与正式发布并发上传 Central 互相踩
concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  # 读版本：非 SNAPSHOT 就整个跳过，绝不把非快照版本推上 Central
  check:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha != '') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin the snapshot commit
        id: source
        shell: bash
        env:
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # GitHub 表达式不区分大小写；在 checkout 前精确区分 main 和 Main。
          # workflow_run 的 GITHUB_SHA 可能指向后来推送的提交，必须使用上游 CI 的 SHA。
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              snapshot_ref="refs/heads/$CI_HEAD_BRANCH"
              snapshot_sha="$CI_HEAD_SHA"
              ;;
            workflow_dispatch)
              snapshot_ref="$GITHUB_REF"
              snapshot_sha="$GITHUB_SHA"
              ;;
            *) exit 1 ;;
          esac
          if [[ "$snapshot_ref" != refs/heads/main || ! "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Snapshot publishing requires main and a valid commit SHA.'
            exit 1
          fi
          printf 'sha=%s\n' "$snapshot_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Resolve the revision
        id: version
        run: |
          REV=$(mvn --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=revision)
          echo "revision is ${REV}"
          case "${REV}" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT" ;;
          esac

  publish:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      needs.check.outputs.source_sha != '' &&
      needs.check.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Show Maven environment
        run: |
          java -version
          mvn -version
      - name: Clean
        run: mvn --batch-mode clean
      - name: Publish SNAPSHOT to Maven Central
        # -Prelease 提供 central-publishing-maven-plugin（0.7.0+ 对 -SNAPSHOT 自动路由到快照仓库）；
        # Portal 对快照不做校验、可覆盖发布，签名无意义。
        # -pl 只点根 POM 与两个库模块：test-boot2 / test-boot3 是可运行示例工程，绝不上传
        run: >
          mvn --errors --batch-mode deploy -Prelease -DskipTests -Dgpg.skip=true
          -pl .,operate-log-core,operate-log-spring-boot-starter
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
