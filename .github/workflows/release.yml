name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
      next_snapshot:
        description: 'Next snapshot version (e.g. 1.1.0-SNAPSHOT)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'devoracode/operate-log'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version (tag trigger)
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Set release version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn versions:set -DnewVersion="${{ github.event.inputs.release_version }}" -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git add pom.xml operate-log-core/pom.xml operate-log-spring-boot-starter/pom.xml operate-log-test-boot2/pom.xml operate-log-test-boot3/pom.xml 2>/dev/null || true
          git commit -m "chore(release): $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" || echo "Nothing to commit"

      - name: Deploy to Maven Central
        run: mvn -B deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Set next snapshot version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn versions:set -DnewVersion="${{ github.event.inputs.next_snapshot }}" -DgenerateBackupPoms=false
          git add pom.xml operate-log-core/pom.xml operate-log-spring-boot-starter/pom.xml operate-log-test-boot2/pom.xml operate-log-test-boot3/pom.xml 2>/dev/null || true
          git commit -m "chore(snapshot): bump to ${{ github.event.inputs.next_snapshot }}"
          git push origin HEAD:main
