# operate-log 发布流水线
#
# 触发：推送 v* tag（如 v1.0.1），或 workflow_dispatch 手动指定 tag。
# 流程：前置校验（tag 与 pom 版本一致、非 SNAPSHOT）
#       → japicmp 二进制兼容门禁（对比上一个 release tag，首版自动跳过）
#       → GPG 签名并上传 Maven Central（仅 core + starter 两个发布物）
#       → 创建 GitHub Release（发布说明取 CHANGELOG 对应小节）
#
# 所需 repository secrets：
#   GPG_PRIVATE_KEY   ASCII  armored 私钥（签名制品，Central 强制）
#   GPG_PASSPHRASE    私钥口令
#   CENTRAL_USERNAME  Central Portal 用户名（token 形式 User Token）
#   CENTRAL_TOKEN     Central Portal 密码（User Token）
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (full history for tags & CHANGELOG)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          POM_VERSION="$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec | tr -d '[:space:]')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION pom=$POM_VERSION"
          if [ "$VERSION" != "$POM_VERSION" ]; then
            echo "::error::tag version ($VERSION) != pom version ($POM_VERSION)"; exit 1
          fi
          case "$VERSION" in
            *-SNAPSHOT*) echo "::error::refusing to release a SNAPSHOT version"; exit 1 ;;
          esac

      - name: Find previous release tag (compat baseline)
        id: baseline
        run: |
          PREV="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${{ steps.ver.outputs.tag }}$" | head -n1 || true)"
          if [ -n "$PREV" ]; then
            echo "version=${PREV#v}" >> "$GITHUB_OUTPUT"
            echo "baseline=$PREV (japicmp gate will run)"
          else
            echo "First release: no baseline, japicmp gate skipped."
          fi

      - name: Set up JDK 17 with signing & Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central   # 对齐 central-publishing-maven-plugin 的 publishingServerId
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Binary compatibility gate (japicmp vs previous release)
        if: steps.baseline.outputs.version != ''
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp -DskipTests \
              -pl operate-log-core,operate-log-spring-boot-starter \
              verify -Djapicmp.oldVersion=${{ steps.baseline.outputs.version }}

      - name: Sign & deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 根（parent）pom 必须随发布：子模块 pom 引用 parent，缺失则下游无法解析
          mvn -B -ntp -Prelease -DskipTests \
              -pl .,operate-log-core,operate-log-spring-boot-starter \
              deploy

      - name: Extract CHANGELOG section
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          {
            echo "## operate-log $VERSION"
            echo
            awk -v ver="$VERSION" '
              $0 ~ "^## \\\\[?" ver {found=1; next}
              found && /^## /     {exit}
              found                {print}
            ' CHANGELOG.md
          } > release-notes.md
          if ! grep -q "$VERSION" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          cat release-notes.md

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" -F release-notes.md --title "operate-log $TAG"
          else
            gh release create "$TAG" -F release-notes.md --title "operate-log $TAG" --latest
          fi
