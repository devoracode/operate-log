operate-log:
  application: operate-log-test
  environment: test
  version: 1.0.0-SNAPSHOT
  trace-id-mdc-key: traceId # traceId 的 MDC key，可对齐链路追踪体系（如 trace_id）
  http:
    trust-proxy: false
    capture-headers: false
  mask:
    enabled: true
    mask-text: "******"
    # fields 为【追加】语义：内置 11 项默认字段始终脱敏，此处只列额外需要脱敏的字段名。
    # 默认字段：password / passwd / pwd / token / accessToken / refreshToken /
    #          authorization / cookie / set-cookie / secret / clientSecret
    # fields:
    #   - mobile
    #   - idCard
  spel:
    enabled: true
    cache-size: 1024
  payload:
    max-request-length: 0
    max-response-length: 0
    max-error-length: 0
